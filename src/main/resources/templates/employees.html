
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <h2>Add Employee</h2>

    <form th:action="@{/save}" th:object="${employee}" method="post">
        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required>
        <br><br>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <br><br>

        <label>Department:</label>
        <input type="text" th:field="*{department}" required>
        <br><br>

        <label>Salary:</label>
        <input type="number" step="0.01" th:field="*{salary}" required>
        <br><br>

        <button type="submit">Save Employee</button>
    </form>

    <h2>Employee List</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <a th:href="@{/edit/{id}(id=${emp.id})}">Edit</a>
                    |
                    <a th:href="@{/delete/{id}(id=${emp.id})}"
                       onclick="return confirm('Are you sure you want to delete this employee?')">
                        Delete
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
