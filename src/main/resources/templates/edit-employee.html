
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>

    <h1>Edit Employee</h1>

    <form th:action="@{/update/{id}(id=${employee.id})}"
          th:object="${employee}" method="post">

        <label>Full Name:</label>
        <input type="text" th:field="*{fullName}" required>
        <br><br>

        <label>Email:</label>
        <input type="email" th:field="*{email}" required>
        <br><br>

        <label>Department:</label>
        <input type="text" th:field="*{department}" required>
        <br><br>

        <label>Salary:</label>
        <input type="number" step="0.01" th:field="*{salary}" required>
        <br><br>

        <button type="submit">Update Employee</button>
    </form>

    <br>
    <a th:href="@{/}">Back to Employee List</a>

</body>
</html>
